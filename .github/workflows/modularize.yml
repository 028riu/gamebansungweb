name: Build editable SECTOR ZERO structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split latest game into clean folders
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          src = root / 'index.html'
          text = src.read_text(encoding='utf-8')

          styles = re.findall(r'<style\b[^>]*>(.*?)</style>', text, flags=re.S|re.I)
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          if not styles or not scripts:
              raise SystemExit('index.html does not contain the expected CSS/JS source blocks')

          main_js = max(scripts, key=len)
          marker = re.compile(r'/\*\s*=+\s*\[(\d+)\]\s*([^\n*]+).*?\*/', re.S)
          matches = list(marker.finditer(main_js))
          if len(matches) < 10:
              raise SystemExit(f'Only {len(matches)} game sections detected; refusing to split.')

          # Names are deliberately based on the game's systems, so editing is easy.
          names = {
              1: 'core.js',
              2: 'device.js',
              3: 'audio.js',
              4: 'input.js',
              5: 'camera.js',
              6: 'maps.js',
              7: 'particles.js',
              8: 'blood-effects.js',
              9: 'projectiles.js',
              10: 'weapons.js',
              11: 'player.js',
              12: 'enemies.js',
              13: 'boss.js',
              14: 'loot.js',
              15: 'waves.js',
              16: 'hud.js',
              17: 'render.js',
              18: 'game-state.js',
              19: 'game-loop.js',
              20: 'ui.js'
          }

          css_dir = root / 'css'
          js_dir = root / 'js'
          css_dir.mkdir(exist_ok=True)
          js_dir.mkdir(exist_ok=True)
          (css_dir / 'style.css').write_text('\\n\\n'.join(styles).strip() + '\\n', encoding='utf-8')

          created = []
          for i, m in enumerate(matches):
              num = int(m.group(1))
              start = m.start()
              end = matches[i+1].start() if i + 1 < len(matches) else len(main_js)
              body = main_js[start:end].strip()
              filename = names.get(num, f'module-{num}.js')
              (js_dir / filename).write_text("'use strict';\\n\\n" + body + '\\n', encoding='utf-8')
              created.append(filename)

          # Strip embedded CSS/JS from HTML and reference only the two folders.
          html = re.sub(r'<style\b[^>]*>.*?</style>', '', text, flags=re.S|re.I)
          html = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.S|re.I)
          html = re.sub(r'\\n?\\s*<link rel="stylesheet" href="css/style.css">', '', html, flags=re.I)
          html = re.sub(r'</head>', '  <link rel="stylesheet" href="css/style.css">\\n</head>', html, count=1, flags=re.I)
          tags = '\\n'.join(f'  <script src="js/{name}"></script>' for name in created)
          html = re.sub(r'</body>', tags + '\\n</body>', html, count=1, flags=re.I)
          src.write_text(html, encoding='utf-8')

          # Remove stale generated files.
          keep = set(created)
          for p in js_dir.glob('*.js'):
              if p.name not in keep:
                  p.unlink()
          for p in css_dir.iterdir():
              if p.is_file() and p.name != 'style.css':
                  p.unlink()

          # Final repository must contain only index.html + css/ + js/.
          for p in list(root.iterdir()):
              if p.name in {'index.html', 'css', 'js', '.git', '.github'}:
                  continue
              if p.is_dir():
                  shutil.rmtree(p)
              else:
                  p.unlink()

          # Remove this one-time workflow after it has produced the final structure.
          wf = root / '.github' / 'workflows' / 'modularize.yml'
          if wf.exists():
              wf.unlink()
          try:
              (root / '.github' / 'workflows').rmdir()
              (root / '.github').rmdir()
          except OSError:
              pass

          if '<style' in html.lower() or re.search(r'<script\s*>', html, re.I):
              raise SystemExit('Embedded CSS/JS remained in index.html')
          if not (css_dir / 'style.css').exists():
              raise SystemExit('style.css was not created')
          if len(created) < 10:
              raise SystemExit('Too few JS modules created')
          PY

      - name: Validate JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Commit final clean structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split game into editable named modules" || exit 0
          git push
